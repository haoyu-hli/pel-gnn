[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pel-gnn"
version = "0.1.0"
description = "Atomic graph models for transition-state proposal in Lennard-Jones glasses"
readme = "README.md"
authors = [
  { name = "Haoyu Li", email = "haoyuli@umich.edu" },
]
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.9,<2",
  "torch>=2.1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7,<9",
]

[project.scripts]
pelgnn-demo = "pelgnn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
